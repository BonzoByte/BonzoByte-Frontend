<!doctype html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

    <script>
        (function () {
            try {
                // Capture email verification tokens before Angular boots.
                if (window.location.pathname.replace(/\/+$/, '') !== '/verify') return;
                var token = new URLSearchParams((window.location.hash || '').replace(/^#\??/, '')).get('token')
                    || new URLSearchParams(window.location.search).get('token');
                if (!token) return;
                sessionStorage.setItem('verifyToken', token);
                history.replaceState(history.state, document.title, window.location.pathname);
            } catch (e) {
                console.warn('[verify preboot] failed to capture token', e);
            }
        })();
    </script>

    <script>
        (function () {
            try {
                var path = window.location.pathname.replace(/\/+$/, '');
                if (path !== '/oauth-success') return;

                var hash = (window.location.hash || '').replace(/^#/, '');
                if (!hash) return;

                var token = new URLSearchParams(hash).get('token');
                if (!token) return;

                // Hand the token to Angular and remove it before analytics scripts load.
                sessionStorage.setItem('BB_oauth_token', token);
                history.replaceState(null, document.title, window.location.pathname + window.location.search);
            } catch (_) { }
        })();
    </script>

    <script>
        (function () {
            var params = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
            var token = params.get('ref');
            if (!token || !/^[a-f0-9]{64}$/.test(token)) return;
            // Remove referral tokens before any analytics script runs.
            window.BB_referral_token = token;
            try { sessionStorage.setItem('bonzobyte.referral.pending.v1', token); } catch (_) { }
            params.delete('ref');
            history.replaceState(history.state, document.title, window.location.pathname + window.location.search
                + (params.toString() ? '#' + params.toString() : ''));
        })();
    </script>

    <meta charset="utf-8">
    <title>BonzoByte | Full-Stack Tennis Analytics Platform</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta
        name="description"
        content="BonzoByte is a full-stack tennis analytics platform showcasing ASP.NET Core, Angular, SQL Server, Brotli archive delivery, granular TrueSkill modeling, neural-network probabilities, and research-driven model insights." />

    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0f0f0f">

    <!-- Optional analytics is loaded by ConsentedAnalyticsService only after consent. -->

    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
    <app-root></app-root>
</body>
</html>
