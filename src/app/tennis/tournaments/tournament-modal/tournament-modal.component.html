<div class="bb-backdrop"></div>

<div class="bb-modal bb-modal--tournament-details" role="dialog" aria-modal="true" appTrapFocus [onEscape]="closeFromKeyboard" [attr.aria-label]="'details.tournamentTitle' | translate">
  <button class="close-button" type="button" (click)="close()" [attr.aria-label]="'common.close' | translate">×</button>

  <div class="bb-modal-header">
    <h2 class="bb-modal-title">{{ 'details.tournamentTitle' | translate }}</h2>
  </div>

  <div class="bb-modal-body">
    <p *ngIf="isPreview" role="note">{{ 'popularity.previewNotice' | translate }}</p>
    <div class="bb-tournament-overview-wrap">

      <div class="bb-tournament-head">
        <span
          class="bb-flag-wrap"
          *ngIf="tournamentIso2"
          [title]="tournament?.countryFull || ('details.country' | translate)">
          <span class="fi fi-{{ flagIso2OrEmpty(tournamentIso2) }} bb-flag-sm"></span>
        </span>

        <div class="bb-tournament-name">
          {{ tournamentName }}
          <span *ngIf="tournamentIso3">({{ tournamentIso3 }})</span>
        </div>
      </div>

      <div class="bb-tournament-info" *ngIf="overviewRows.length">
        <div class="bb-tournament-info-row" *ngFor="let row of overviewRows">
          <div class="bb-tournament-info-label">{{ row.label | translate }}:</div>
          <div class="bb-tournament-info-value" [class.strength-cell]="row.stars != null">
            <span *ngIf="row.label === 'details.surface'" class="surface-indicator"
              [ngClass]="'surface-indicator--' + surfaceCode"
              aria-hidden="true"></span>
            <span>{{ row.label === 'details.surface' ? (row.value | translate | uppercase) : row.value }}</span>
            <span class="stars bb-info-stars" *ngIf="row.stars != null" role="img"
              [attr.aria-label]="'details.stars' | translate:{label: (row.label | translate), count: regional.number(row.stars, 1)}">
              <span *ngFor="let s of stars" class="star" [ngClass]="starClass(s, row.stars)"></span>
            </span>
          </div>
        </div>
      </div>

      <app-recent-matches *ngIf="tournament && tournament.tournamentEventTPId > 0 && !isPreview" scope="tournament" [entityId]="tournament.tournamentEventTPId"></app-recent-matches>
      <div class="bb-tournament-actions" *ngIf="tournament && tournament.tournamentEventTPId > 0 && !isPreview">
        <button
          type="button"
          class="bb-btn bb-btn--secondary"
          (click)="showAllMatches()">
          {{ 'common.showAllMatches' | translate }}
        </button>
      </div>

    </div>
  </div>
</div>
