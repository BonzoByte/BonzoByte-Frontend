<app-bb-modal-shell
  [title]="'auth.resetTitle' | translate"
  [subtitle]="'auth.resetSubtitle' | translate"
  [closeLabel]="'common.close' | translate"
  (closed)="closeAndGoToLogin()"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off" novalidate>
    <!-- PASSWORD -->
    <div class="form-row">
      <label for="password">{{ 'auth.newPassword' | translate }}</label>

      <div class="password-wrapper">
        <input
          [type]="showPassword ? 'text' : 'password'"
          id="password"
          formControlName="password"
          appCapsLock #passwordCaps="capsLock"
          class="password-input"
          [placeholder]="'auth.newPassword' | translate"
          autocomplete="new-password"
          [class.invalid]="form.get('password')?.invalid && (form.get('password')?.touched || submitted)"
        />

        <button
          type="button"
          class="toggle-password"
          appAccessibleClick
          (accessibleClick)="showPassword = !showPassword"
          [attr.aria-label]="'auth.togglePassword' | translate"
        >
          <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
        </button>
      </div>

      <app-caps-lock-hint [field]="passwordCaps" />
      <p
        class="error"
        *ngIf="form.get('password')?.hasError('required') && (form.get('password')?.touched || submitted)"
      >
        {{ 'auth.required' | translate }}
      </p>
    </div>

    <!-- CONFIRM -->
    <div class="form-row">
      <label for="confirm">{{ 'auth.confirmPassword' | translate }}</label>

      <div class="password-wrapper">
        <input
          [type]="showConfirm ? 'text' : 'password'"
          id="confirm"
          formControlName="confirm"
          appCapsLock #confirmCaps="capsLock"
          class="password-input"
          [placeholder]="'auth.confirmPassword' | translate"
          autocomplete="new-password"
          [class.invalid]="(form.touched || submitted) && !!form.errors?.['passwordsMismatch']"
        />

        <button
          type="button"
          class="toggle-password"
          appAccessibleClick
          (accessibleClick)="showConfirm = !showConfirm"
          [attr.aria-label]="'auth.toggleConfirm' | translate"
        >
          <i class="bi" [ngClass]="showConfirm ? 'bi-eye-slash' : 'bi-eye'"></i>
        </button>
      </div>

      <app-caps-lock-hint [field]="confirmCaps" />
      <p class="error" *ngIf="form.errors?.['passwordsMismatch'] && (form.touched || submitted)">
        {{ 'auth.passwordMismatch' | translate }}
      </p>
    </div>

    <!-- STATUS -->
    <div class="bb-alert bb-alert--success" *ngIf="successMessage">
      {{ successMessage | translate }}
    </div>

    <div class="bb-alert bb-alert--error" *ngIf="errorMessage">
      {{ errorMessage | translate }}
    </div>

    <div bbActions class="bb-actions">
      <button type="button" class="oauth-btn" (click)="closeAndGoToLogin()">{{ 'common.cancel' | translate }}</button>

      <button
        type="submit"
        class="oauth-btn oauth-btn-primary"
        [disabled]="form.invalid || loading"
      >
        {{ (loading ? 'auth.resetting' : 'auth.resetAction') | translate }}
      </button>
    </div>
  </form>
</app-bb-modal-shell>
